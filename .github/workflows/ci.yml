# Continuous integration: the same checks as `make lint` and `make scan`, every demo, and the Docker image (scanned,
# then tested and demoed with no network) on each push and pull request; a LIVE smoke test on pushes to main and
# on manual dispatch. Runners are pinned to ubuntu-24.04 so an image migration is a deliberate change.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SANDBOX_IMAGE: maven:3.9-eclipse-temurin-25

jobs:
  lint:
    name: Lint and static security (actionlint, zizmor, shellcheck, gitleaks, Trivy config)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # A newer push supersedes this job; live-smoke has its own group and is never cancelled mid-run.
    concurrency:
      group: ci-lint-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history
          persist-credentials: false
      - name: Static checks
        run: scripts/lint.sh

  quality:
    name: Build, test, SAST, SCA, secrets, DAST, demos
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # A newer push supersedes this job; live-smoke has its own group and is never cancelled mid-run.
    concurrency:
      group: ci-quality-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Tool versions
        run: |
          java -version
          mvn -version
          docker version --format 'docker {{.Server.Version}}'

      - name: Pull the gate sandbox image
        run: docker pull -q "$SANDBOX_IMAGE"

      # Strict builds (-Werror), SpotBugs + FindSecBugs, PMD + CPD, all tests (build gates run in the container
      # sandbox), JaCoCo, CycloneDX SBOMs, Trivy SCA and secret scan, OWASP ZAP API scan. SonarQube runs only when
      # the SONAR_HOST_URL and SONAR_TOKEN secrets are configured.
      - name: Quality and security scan
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: scripts/quality-scan.sh

      # Line and branch coverage of both projects against the 100% target, naming every class below it.
      - name: Coverage inventory
        run: python3 scripts/coverage-report.py | tee target/quality/coverage.md

      - name: Demos (all four scenarios, MOCK mode, real gates)
        run: scripts/demo-all.sh

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          if-no-files-found: ignore
          path: |
            runs/*/report.md
            runs/*/incident.md
            target/quality/
            orchestrator/target/site/jacoco/
            shortener-service/target/site/jacoco/
            orchestrator/target/surefire-reports/
            orchestrator/target/scenario-incidents/
            shortener-service/target/surefire-reports/

  docker:
    name: Docker image (vulnerability scan, offline tests and demos)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # A newer push supersedes this job; live-smoke has its own group and is never cancelled mid-run.
    concurrency:
      group: ci-docker-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build -t agentic-sdlc .

      # OS packages and application jars. The image's pre-warmed Maven cache holds only build-plugin dependencies,
      # which run offline at build time; the runtime dependencies are scanned from their SBOMs in the quality job.
      - name: Trivy image scan
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.74.0
          image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          --skip-dirs /home/app/.m2 agentic-sdlc

      # Option A of the README, offline: the full test suite and every demo inside the image.
      - name: Tests inside the image, no network
        run: docker run --rm --network none agentic-sdlc test

      - name: All four demos inside the image, no network
        run: docker run --rm --network none agentic-sdlc demo-all

  perf:
    name: k6 performance tests (smoke always · load+stress on main)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: ci-perf-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Install k6
        run: |
          curl -fsSL https://dl.k6.io/key.gpg \
            | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -q && sudo apt-get install -q k6
          k6 version

      - name: Build shortener jar (skip tests — quality job covers them)
        run: mvn -q -B -f shortener-service/pom.xml package -DskipTests

      - name: Start shortener service
        run: |
          mkdir -p target/perf
          nohup java -jar shortener-service/target/shortener-service-*.jar \
            > target/perf/service.log 2>&1 &
          echo $! > target/perf/service.pid
          echo "Service PID: $(cat target/perf/service.pid)"

      - name: Wait for service health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "Service is up"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          echo "Service did not start in time:" && tail -40 target/perf/service.log
          exit 1

      # Smoke runs on every push/PR — hard thresholds, fails the job on breach.
      - name: k6 smoke (1 VU · 30 s · all endpoints)
        run: |
          k6 run \
            --env BASE_URL=http://localhost:8080 \
            --out json=target/perf/smoke-results.json \
            perf/k6/smoke.js

      # Load and stress run only on main pushes and manual dispatch.
      # stress uses continue-on-error because it intentionally saturates
      # the service and threshold breaches there are informational.
      - name: k6 load (10 VUs · 3 min · p95 SLOs enforced)
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: |
          k6 run \
            --env BASE_URL=http://localhost:8080 \
            --out json=target/perf/load-results.json \
            perf/k6/load.js

      - name: k6 stress (ramp 0→100 VUs · saturation point — informational)
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          k6 run \
            --env BASE_URL=http://localhost:8080 \
            --out json=target/perf/stress-results.json \
            perf/k6/stress.js

      - name: Stop shortener service
        if: always()
        run: |
          if [[ -f target/perf/service.pid ]]; then
            kill "$(cat target/perf/service.pid)" 2>/dev/null || true
          fi

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-results
          if-no-files-found: ignore
          path: |
            target/perf/*-results.json
            target/perf/service.log

  # Real-model integration on every push to main of this repository (not forks) and from the Run workflow button. The
  # job condition excludes pull requests; those from forks could not read the secret anyway. Each run spends API
  # credit (about 170k input tokens) and live output varies, so on a push a failure is reported on the job without
  # failing the workflow, and a missing secret or variable skips the run; a manual run stays strict. Needs the
  # ANTHROPIC_API_KEY secret and the ANTHROPIC_MODEL variable. Stops at the first human checkpoint.
  live-smoke:
    name: LIVE smoke test (real model)
    if: >-
      !github.event.repository.fork &&
      (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Queued, never cancelled: a run in progress has already spent API credit.
    concurrency:
      group: live-smoke-${{ github.ref }}
      cancel-in-progress: false
    continue-on-error: ${{ github.event_name == 'push' }}
    steps:
      - name: Check the model configuration
        id: config
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ -n "$ANTHROPIC_API_KEY" && -n "$ANTHROPIC_MODEL" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT" == "workflow_dispatch" ]]; then
            echo "::error::LIVE smoke needs the ANTHROPIC_API_KEY secret and the ANTHROPIC_MODEL variable."
            exit 1
          else
            echo "::notice::LIVE smoke skipped: set the ANTHROPIC_API_KEY secret and the ANTHROPIC_MODEL variable to enable it."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.config.outputs.configured == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: steps.config.outputs.configured == 'true'
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build (warms the Maven cache the gates use)
        if: steps.config.outputs.configured == 'true'
        run: |
          docker pull -q "$SANDBOX_IMAGE"
          mvn -q -B -f shortener-service/pom.xml verify -Dmaven.test.redirectTestOutputToFile=true
          mvn -q -B package -DskipTests

      - name: LIVE bug-fix run
        if: steps.config.outputs.configured == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: scripts/live-smoke.sh

      - name: Upload the LIVE report
        if: always() && steps.config.outputs.configured == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-smoke
          if-no-files-found: ignore
          path: |
            runs/*/report.md
            runs/*/incident.md
