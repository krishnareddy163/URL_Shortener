spring.application.name=shortener-service
spring.datasource.url=jdbc:h2:mem:shortener;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=true
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=true
shortener.rate-limit.requests-per-minute=20
shortener.base-url=

# Graceful shutdown: drain in-flight requests before the JVM exits (Kubernetes SIGTERM support).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Actuator: health and info for load balancers; metrics for dashboards.
# env, beans and heapdump are deliberately excluded to prevent information disclosure.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
info.app.name=shortener-service
info.app.description=URL shortener: link creation, redirects, and click analytics

# Incident notification emails (disabled by default).
# Set enabled=true and configure spring.mail.* to activate.
shortener.incident.notification.enabled=false
shortener.incident.notification.to=
shortener.incident.notification.from=noreply@shortener-service

# SMTP — fill these in when enabling incident notifications:
# spring.mail.host=smtp.example.com
# spring.mail.port=587
# spring.mail.username=
# spring.mail.password=
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true

# OpenAPI / Swagger UI: reachable at /swagger-ui.html and /api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.api-docs.path=/api-docs
