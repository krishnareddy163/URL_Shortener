spring.application.name=shortener-service
spring.datasource.url=jdbc:h2:mem:shortener;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=true
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=true
shortener.rate-limit.requests-per-minute=20
shortener.base-url=

# Actuator: expose only health and info; never expose env, beans, or heap dumps publicly.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
info.app.name=shortener-service
info.app.description=URL shortener: link creation, redirects, and click analytics
